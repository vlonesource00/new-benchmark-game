[project]
name = "pulse-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.12.1",
  "numpy>=2.2,<3",
  "onnx>=1.18,<2",
  "onnxruntime>=1.23,<2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
